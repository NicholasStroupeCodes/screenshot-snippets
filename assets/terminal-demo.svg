<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#012456"/>
      <stop offset="100%" stop-color="#00183a"/>
    </linearGradient>
    <linearGradient id="cmdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  
  <rect width="1000" height="420" rx="16" fill="#11111b"/>
  
  <!-- PowerShell window -->
  <rect x="50" y="30" width="900" height="170" rx="10" fill="url(#psGrad)" stroke="#45475a" stroke-width="2"/>
  <circle cx="80" cy="55" r="8" fill="#f38ba8"/>
  <circle cx="102" cy="55" r="8" fill="#f9e2af"/>
  <circle cx="124" cy="55" r="8" fill="#a6e3a1"/>
  <text x="160" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#cdd6f4" opacity="0.8">Windows PowerShell</text>
  
  <text x="75" y="105" font-family="Consolas, monospace" font-size="16" fill="#cdd6f4">PS C:\Users\you&gt; </text>
  <text x="230" y="105" font-family="Consolas, monospace" font-size="16" fill="#a6e3a1">"C:\Users\you\AppData\Local\Temp\clip-20260730-012930.png"</text>
  
  <text x="75" y="145" font-family="Consolas, monospace" font-size="16" fill="#cdd6f4">PS C:\Users\you&gt; </text>
  <text x="230" y="145" font-family="Consolas, monospace" font-size="16" fill="#89b4fa">kimi analyze-clip</text>
  
  <rect x="230" y="150" width="16" height="3" fill="#cdd6f4"/>
  
  <!-- CMD window -->
  <rect x="50" y="220" width="900" height="170" rx="10" fill="url(#cmdGrad)" stroke="#45475a" stroke-width="2"/>
  <circle cx="80" cy="245" r="8" fill="#f38ba8"/>
  <circle cx="102" cy="245" r="8" fill="#f9e2af"/>
  <circle cx="124" cy="245" r="8" fill="#a6e3a1"/>
  <text x="160" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#cdd6f4" opacity="0.8">Command Prompt</text>
  
  <text x="75" y="295" font-family="Consolas, monospace" font-size="16" fill="#cdd6f4">C:\Users\you&gt; </text>
  <text x="220" y="295" font-family="Consolas, monospace" font-size="16" fill="#a6e3a1">"C:\Users\you\AppData\Local\Temp\clip-20260730-012930.png"</text>
  
  <text x="75" y="335" font-family="Consolas, monospace" font-size="16" fill="#cdd6f4">C:\Users\you&gt; </text>
  <text x="220" y="335" font-family="Consolas, monospace" font-size="16" fill="#89b4fa">claude analyze-image</text>
  
  <rect x="220" y="340" width="16" height="3" fill="#cdd6f4"/>
</svg>
